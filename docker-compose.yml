version: '3.8'

# AI Radio Station - Portainer Optimized
# Deploy via Portainer GUI or docker-compose
# 
# Instructions:
# 1. Copy this entire file
# 2. In Portainer: Stacks → Add Stack → Paste this file
# 3. Add environment variables in Portainer UI
# 4. Deploy
#
# Environment Variables Required:
# - PLEX_URL (default: https://plex.orosz.cc - the container's isolated
#   bridge network below can't reach the QNAP's own LAN IP, so a LAN
#   address here will fail with "All connection attempts failed")
# - PLEX_TOKEN
# - LASTFM_API_KEY
# - LASTFM_USERNAME
# - ANTHROPIC_API_KEY
#
# Optional (TTS - degrades to text-only if unset):
# - TTS_PROVIDER (default: google)
# - GOOGLE_CLOUD_CREDENTIALS_JSON (base64-encoded service account key JSON - see README)
# - ELEVENLABS_API_KEY
#
# Frontend (ai-radio-frontend, below): a real `docker build` from this
# repo's git history, needs a `git` binary on the Docker host itself
# (confirmed live - earlier this host had none, and both BuildKit's
# git-context fetch and the legacy builder failed on it; now installed).
# If deploying somewhere without git on the host, use
# docker-compose.frontend.yml + scripts/deploy-frontend.sh instead, which
# works around that by cloning through a container.

services:
  ai-radio:
    image: python:3.11
    # Pulls the whole repo via git clone rather than wget-ing individual files.
    # The previous per-file wget approach silently dropped any new backend
    # module (tts_service.py, plex_client.py, etc.) added after the compose
    # file was written, and raw.githubusercontent.com's CDN can serve a stale
    # cached copy of an individual file for a few minutes after a push.
    # A shallow git clone always pulls the complete, current tree in one shot.
    # Clones into a scratch path and copies only backend/ + requirements.txt
    # into /app, rather than `rm -rf /app` first - /app/logs is the bind
    # mount below, and you can't rm a mount point from inside the
    # container ("Device or resource busy"), which silently short-circuited
    # every earlier version of this command before git clone ever ran.
    command: bash -c "apt-get update -qq && apt-get install -y -qq git && rm -rf /tmp/app-src && git clone --depth 1 --branch main https://github.com/trippytaco/ai-radio-station.git /tmp/app-src && mkdir -p /app && rm -rf /app/backend && cp -r /tmp/app-src/backend /app/backend && cp /tmp/app-src/requirements.txt /app/requirements.txt && cd /app && pip install --no-cache-dir -r requirements.txt && cd backend && python radio_api.py"
    
    container_name: ai-radio-station
    
    # Port mapping: external:internal
    ports:
      - "8000:8000"
    
    # Environment variables
    environment:
      # Plex Configuration
      PLEX_URL: ${PLEX_URL:-https://plex.orosz.cc}
      PLEX_TOKEN: ${PLEX_TOKEN}
      
      # Last.fm Configuration
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      LASTFM_USERNAME: ${LASTFM_USERNAME}
      
      # Anthropic (Claude) Configuration
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # TTS Configuration (optional - degrades to text-only if unset)
      TTS_PROVIDER: ${TTS_PROVIDER:-google}
      GOOGLE_CLOUD_CREDENTIALS_JSON: ${GOOGLE_CLOUD_CREDENTIALS_JSON:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}

      # Optional: News Sources
      BBC_URL: ${BBC_URL:-https://www.bbc.com/news}
      GUARDIAN_API_KEY: ${GUARDIAN_API_KEY:-}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      
      # Server Configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      DEBUG: ${DEBUG:-false}
    
    # Volume mounts
    volumes:
      # Logs directory
      - ./logs:/app/logs
      
      # Optional: Mount source code for development
      # - ./backend:/app/backend
      # - ./frontend:/app/frontend
      # - ./requirements.txt:/app/requirements.txt
    
    # Always restart unless stopped manually
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s          # Check every 30 seconds
      timeout: 10s           # Timeout after 10 seconds
      retries: 3             # Fail after 3 failed checks
      start_period: 10s      # Wait 10s before first check
    
    # Resource limits (optional - adjust for your QNAP)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network
    networks:
      - ai-radio-network

  ai-radio-frontend:
    # Real image build (Node build stage -> nginx serve stage), not a
    # runtime install - see frontend/Dockerfile for why that matters
    # (tonight's backend deploy problems were all downstream of the
    # "install everything on every container start" pattern; this
    # avoids it entirely). Portainer builds this from the git context
    # when you deploy/update the stack - expect ~5-10 minutes on first
    # build (mostly `npm install`); a plain `docker restart` just
    # restarts the already-built image, no rebuild.
    build:
      context: https://github.com/trippytaco/ai-radio-station.git#main:frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}

    container_name: ai-radio-frontend

    # Port 8080 was already taken by something else on this QNAP
    # (confirmed live, not a Docker container - likely a QTS system
    # service) - 8090 is free. Adjust if it collides on your host.
    ports:
      - "8090:80"

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Network configuration
networks:
  ai-radio-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# Optional: Add volumes for persistent data
volumes:
  ai-radio-logs:
    driver: local
