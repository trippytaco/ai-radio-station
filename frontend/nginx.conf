server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - every route serves index.html, React Router-less
    # client-side routing (none used yet, but keeps this future-proof).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the app shell or manifest/service worker - a redeploy
    # should be picked up immediately, not stuck behind a stale cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets (Vite fingerprints filenames) are safe to cache
    # forever - a new build always gets new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
